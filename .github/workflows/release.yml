name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [master]

# No nuget-release environment gate here — unlike gamecapture-engine, this repo publishes nothing
# to nuget.org (SPLIT-MANIFEST.md's "Workflow split plan": "plugins repo has no publish target").
# Every merged PR targeting master cuts self-contained plugin zips as GitHub release assets. The
# target variant is required so a merged fork PR receives the repository's write-capable token;
# the job is gated below and checks out only the resulting merge commit.
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write # gh release create and tag creation; unlisted scopes are disabled.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Same pinned-engine-binary need as ci.yml, so the merge-triggered release re-verifies the
      # parity suites against the exact engine version this release states it was tested against.
      - name: Download pinned engine release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $engineVersion = (Get-Content engine-version.txt).Trim()
          gh release download $engineVersion -R PetitCastor/gamecapture-engine -p "GameCapture.Engine-*-win-x64.zip" -D .
          Expand-Archive -Path "GameCapture.Engine-*-win-x64.zip" -DestinationPath engine
          $enginePath = (Get-ChildItem -Path engine -Filter "GameCapture.Engine.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $enginePath) {
            Write-Error "GameCapture.Engine.exe not found after extracting the pinned release."
            exit 1
          }
          echo "GAMECAPTURE_ENGINE_PATH=$enginePath" >> $env:GITHUB_ENV
          echo "ENGINE_VERSION=$engineVersion" >> $env:GITHUB_ENV

      # Re-verifies rather than trusting the pull request's CI run. Not gated in a required-reviewer
      # environment (see the job comment above), so these validation steps are the release's gate:
      # a failure stops the job before any zip step runs.
      - name: Restore
        run: dotnet restore GameCapturePlugins.slnx

      - name: Build
        run: dotnet build GameCapturePlugins.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GameCapturePlugins.slnx --no-build -c Release --verbosity normal

      # Keep the release gate aligned with CI: build success alone cannot catch a plugin coupling
      # itself to engine/transport internals.
      - name: Plugin boundary grep gate
        shell: bash
        run: |
          if rg -n -g '*.cs' "using Grpc|RpcException|GameCapture\.Contracts\.Proto|GameCapture\.Engine" src/; then
            echo "::error::Plugin boundary violation — a plugin references an engine/transport internal (listed above)."
            exit 1
          fi
          echo "Plugin boundary clean: no engine/transport references under src/."

      - name: Determine release version
        id: release_version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh release list --limit 1000 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName }
          $versions = $tags | Where-Object { $_ -match '^v[0-9]+[.][0-9]+[.][0-9]+$' } | ForEach-Object { [version]$_.Substring(1) }
          if ($versions.Count -eq 0) {
            $nextVersion = [version]::new(1, 0, 0)
          }
          else {
            $latestVersion = $versions | Sort-Object | Select-Object -Last 1
            $nextVersion = [version]::new($latestVersion.Major, $latestVersion.Minor, $latestVersion.Build + 1)
          }
          $tag = "v$nextVersion"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish MissionPlugin
        run: dotnet publish src/MissionPlugin -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/MissionPlugin

      - name: Publish RefineryPlugin
        run: dotnet publish src/RefineryPlugin -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/RefineryPlugin

      - name: Publish SignaturePlugin
        run: dotnet publish src/SignaturePlugin -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/SignaturePlugin

      # Named files, not `publish/<plugin>/*`: PublishSingleFile bundles the managed assemblies into
      # the exe but leaves .pdb files loose, and other publish-layout artifacts (docs xml, framework
      # deps) don't belong in a release zip either. Listing the two files that belong means the
      # release contents can't drift with the publish layout; the Test-Path guard turns a rename or a
      # dropped CopyToOutputDirectory into a failed release rather than a silently incomplete zip.
      - name: Archive plugin zips
        run: |
          $plugins = @('MissionPlugin', 'RefineryPlugin', 'SignaturePlugin')
          foreach ($plugin in $plugins) {
            $files = "publish/$plugin/$plugin.exe", "publish/$plugin/config.json"
            $missing = $files | Where-Object { -not (Test-Path $_) }
            if ($missing) { throw "Missing from publish output: $($missing -join ', ')" }
            Compress-Archive -Path $files -DestinationPath "$plugin-${{ steps.release_version.outputs.tag }}-win-x64.zip"
          }

      # Release notes explicitly name the engine version this release was tested against —
      # engine-version.txt is the only thing tying a plugins release to a compatible engine
      # release, since the two repos version independently and there's no shared version train.
      - name: Write release notes header
        shell: pwsh
        run: |
          @"
          Tested against gamecapture-engine $env:ENGINE_VERSION (pinned in engine-version.txt).

          Mission parity is known-skipped in this build's test run pending an in-game corpus
          capture, and Signature parity is skipped pending its scan-signature corpus (see the
          corresponding test skips and [USER ACTION] in the source repo this was split from) —
          Refinery parity ran for real.
          "@ | Out-File -Encoding utf8 release-notes-header.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.release_version.outputs.tag }} `
            --target ${{ github.event.pull_request.merge_commit_sha }} `
            "MissionPlugin-${{ steps.release_version.outputs.tag }}-win-x64.zip" `
            "RefineryPlugin-${{ steps.release_version.outputs.tag }}-win-x64.zip" `
            "SignaturePlugin-${{ steps.release_version.outputs.tag }}-win-x64.zip" `
            --notes-file release-notes-header.md --generate-notes
